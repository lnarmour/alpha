name: Release VS Code extension

# Scoped to editors/vscode only — kept separate from ci.yml, which stays as the Rust workspace's
# own build+test gate and is unaffected by this workflow.
#
# release-please watches every push to main and maintains a standing release PR for the
# editors/vscode component (versioned via editors/vscode/package.json, per release-please-config.json
# at the repo root); when that PR is merged, this same workflow run also creates the GitHub
# Release/tag and the `build` job below fires to attach platform-specific .vsix files to it.
#
# Marketplace publishing itself is intentionally not wired up here yet — see
# editors/vscode/README.md's "Publishing to the Marketplace" section for the manual steps.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['editors/vscode--release_created'] }}
      tag_name: ${{ steps.release.outputs['editors/vscode--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon hosted runner
            vsce_target: darwin-arm64
          - os: ubuntu-latest
            vsce_target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # Homebrew's isl formula pulls in gmp (and its static libgmp.a) as a dependency, so no
        # separate `brew install gmp` is needed for the native addon's static link (see the Linux
        # step below for why that one needs libgmp-dev spelled out explicitly).
        run: brew install isl pkg-config

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Not installing libisl-dev/libgmp-dev here: the native addon links libisl/libgmp
        # statically (see the "Build isl/gmp from source" step below for why that rules out
        # apt's copies specifically).
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config

      - name: Build isl/gmp from source with -fPIC (Linux)
        if: runner.os == 'Linux'
        # The native addon links libisl/libgmp statically (via ISL_STATIC=1 in
        # editors/vscode/native/package.json's build script) so the shipped .vsix has no runtime
        # dependency on them. apt's libisl-dev/libgmp-dev ship static archives that aren't
        # compiled with -fPIC, though, and linking non-PIC code into the addon's cdylib fails on
        # x86-64 with e.g. "relocation R_X86_64_PC32 cannot be used against symbol 'stderr';
        # recompile with -fPIC" — verified against a real Ubuntu 24.04 container. Building both
        # from source with --with-pic avoids that; installing to our own prefix and pointing
        # PKG_CONFIG_PATH there (pkg-config, and thus isl-sys's build.rs, checks it before any
        # system path) makes that the copy that gets picked up instead of apt's.
        env:
          GMP_VERSION: 6.3.0
          ISL_VERSION: 0.26
        run: |
          PREFIX="$HOME/isl-pic"
          mkdir -p "$HOME/src" && cd "$HOME/src"

          curl -sLO "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          tar xf "gmp-$GMP_VERSION.tar.xz"
          cd "gmp-$GMP_VERSION"
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(nproc)"
          make install
          cd ..

          curl -sL "https://libisl.sourceforge.io/isl-$ISL_VERSION.tar.bz2" -o "isl-$ISL_VERSION.tar.bz2"
          tar xf "isl-$ISL_VERSION.tar.bz2"
          cd "isl-$ISL_VERSION"
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic --with-gmp-prefix="$PREFIX"
          make -j"$(nproc)"
          make install
          cd ..

          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm install

      - name: Install native addon dependencies
        working-directory: editors/vscode/native
        run: npm install

      - name: Build native addon
        working-directory: editors/vscode/native
        run: npm run build

      - name: Compile extension
        working-directory: editors/vscode
        run: npm run compile

      - name: Package platform-specific .vsix
        working-directory: editors/vscode
        run: npx @vscode/vsce package --target ${{ matrix.vsce_target }} -o alpha-language-${{ matrix.vsce_target }}.vsix

      - name: Attach .vsix to the release
        working-directory: editors/vscode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "alpha-language-${{ matrix.vsce_target }}.vsix"
