name: Release

# release-please watches every push to main and maintains two independent standing release PRs,
# one per component in release-please-config.json ("separate-pull-requests": true):
#   - editors/vscode (component alpha-vscode, versioned via editors/vscode/package.json)
#   - alpha-py       (component alphalang,    versioned via alpha-py/pyproject.toml)
# One release-please job below drives both; each build job only fires when *its own* component's
# PR was the one just merged (release-please tags/creates a GitHub Release per component
# independently), so a vscode-only release doesn't rebuild wheels and vice versa.
#
# Neither leg publishes anywhere beyond a GitHub Release yet:
#   - editors/vscode: see editors/vscode/README.md's "Publishing to the Marketplace" section.
#   - alpha-py: download the wheels from the release and `twine upload` them by hand.
# This workflow stays separate from ci.yml, which is the Rust workspace's own build+test gate and
# is unaffected by any of this.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      vscode_release_created: ${{ steps.release.outputs['editors/vscode--release_created'] }}
      vscode_tag_name: ${{ steps.release.outputs['editors/vscode--tag_name'] }}
      python_release_created: ${{ steps.release.outputs['alpha-py--release_created'] }}
      python_tag_name: ${{ steps.release.outputs['alpha-py--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-vscode:
    needs: release-please
    if: ${{ needs.release-please.outputs.vscode_release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon hosted runner
            vsce_target: darwin-arm64
          - os: ubuntu-latest
            vsce_target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # Homebrew's isl formula pulls in gmp (and its static libgmp.a) as a dependency, so no
        # separate `brew install gmp` is needed for the native addon's static link (see the Linux
        # step below for why that one needs libgmp-dev spelled out explicitly).
        run: brew install isl pkg-config

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Not installing libisl-dev/libgmp-dev here: the native addon links libisl/libgmp
        # statically (see the "Build isl/gmp from source" step below for why that rules out
        # apt's copies specifically).
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config

      - name: Build isl/gmp from source with -fPIC (Linux)
        if: runner.os == 'Linux'
        # The native addon links libisl/libgmp statically (via ISL_STATIC=1 in
        # editors/vscode/native/package.json's build script) so the shipped .vsix has no runtime
        # dependency on them. apt's libisl-dev/libgmp-dev ship static archives that aren't
        # compiled with -fPIC, though, and linking non-PIC code into the addon's cdylib fails on
        # x86-64 with e.g. "relocation R_X86_64_PC32 cannot be used against symbol 'stderr';
        # recompile with -fPIC" — verified against a real Ubuntu 24.04 container. Building both
        # from source with --with-pic avoids that; installing to our own prefix and pointing
        # PKG_CONFIG_PATH there (pkg-config, and thus isl-sys's build.rs, checks it before any
        # system path) makes that the copy that gets picked up instead of apt's.
        env:
          GMP_VERSION: 6.3.0
          ISL_VERSION: 0.26
        run: |
          PREFIX="$HOME/isl-pic"
          mkdir -p "$HOME/src" && cd "$HOME/src"

          curl -sLO "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          tar xf "gmp-$GMP_VERSION.tar.xz"
          cd "gmp-$GMP_VERSION"
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(nproc)"
          make install
          cd ..

          curl -sL "https://libisl.sourceforge.io/isl-$ISL_VERSION.tar.bz2" -o "isl-$ISL_VERSION.tar.bz2"
          tar xf "isl-$ISL_VERSION.tar.bz2"
          cd "isl-$ISL_VERSION"
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic --with-gmp-prefix="$PREFIX"
          make -j"$(nproc)"
          make install
          cd ..

          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm install

      - name: Install native addon dependencies
        working-directory: editors/vscode/native
        run: npm install

      - name: Build native addon
        working-directory: editors/vscode/native
        run: npm run build

      - name: Compile extension
        working-directory: editors/vscode
        run: npm run compile

      - name: Package platform-specific .vsix
        working-directory: editors/vscode
        run: npx @vscode/vsce package --target ${{ matrix.vsce_target }} -o alpha-language-${{ matrix.vsce_target }}.vsix

      - name: Attach .vsix to the release
        working-directory: editors/vscode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.vscode_tag_name }}" "alpha-language-${{ matrix.vsce_target }}.vsix"

  build-python-wheels:
    needs: release-please
    if: ${{ needs.release-please.outputs.python_release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon hosted runner -> macosx_arm64
          - os: ubuntu-latest # -> manylinux_x86_64
          - os: ubuntu-24.04-arm # native arm64 hosted runner -> manylinux_aarch64 (no QEMU)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cibuildwheel's manylinux legs compile inside a fresh container (see
      # alpha-py/ci/build-isl-static-linux.sh, wired up via alpha-py/pyproject.toml's
      # [tool.cibuildwheel.linux]), which needs its own Rust toolchain regardless of the host's.
      # macOS builds directly on the runner, so this step is what actually puts cargo/rustc on
      # PATH for that leg.
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'

      # package-dir points cibuildwheel at alpha-py, which is where it looks for pyproject.toml's
      # [tool.cibuildwheel] table by default (`{package}/pyproject.toml`) — no separate
      # --config-file needed. Wheels land in ./wheelhouse (output-dir's default), relative to the
      # repo root this action runs from, not alpha-py.
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: alpha-py

      - name: Attach wheels to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.python_tag_name }}" wheelhouse/*.whl
