[package]
name = "alpha-codegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "simpleC model and the WriteC demand-driven C code generator."

[dependencies]
alpha-syntax.workspace = true
alpha-model.workspace = true
alpha-transform.workspace = true
isl.workspace = true
hugr.workspace = true
tket.workspace = true
barvinok = { workspace = true, optional = true }

[features]
# Off by default: enables Ehrhart/cardinality-based malloc sizing via the GPL-licensed
# barvinok crate. Never enabled in the default `alphac` build or the VS Code addon.
barvinok = ["dep:barvinok"]

[dev-dependencies]
insta = "1.48.0"
